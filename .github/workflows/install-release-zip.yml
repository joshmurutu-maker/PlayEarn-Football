name: Install PlayEarn Football release ZIP

on:
  push:
    branches: [main]
    paths:
      - playearn-football-v0.6.1-imagine-dragons-music.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-and-build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip archive install]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract application into repository root
        run: |
          test -f playearn-football-v0.6.1-imagine-dragons-music.zip
          unzip -q -o playearn-football-v0.6.1-imagine-dragons-music.zip
          cp -a playearn-football/. .
          rm -rf playearn-football
          rm -f playearn-football-v0.6.1-imagine-dragons-music.zip

      - name: Install dependencies and verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit complete application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Install PlayEarn Football v0.6.1 [skip archive install]"
            git push
          fi
